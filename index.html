<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LetrasMix</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      background: radial-gradient(circle at 50% 35%, #3b0764 0%, #1a0533 55%, #0a0015 100%);
      color:#fff; text-align:center; padding:24px;
    }
    .icon { width:96px; height:96px; border-radius:26px; background:radial-gradient(circle at 50% 50%,#7c3aed,#2d1254 55%,#0a0015 100%); display:flex; align-items:center; justify-content:center; gap:6px; margin-bottom:20px; box-shadow:0 10px 30px rgba(124,58,237,0.5); }
    .tile { width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:22px; }
    .tileL { background:linear-gradient(135deg,#fbbf24,#f97316); transform:rotate(-9deg); }
    .tileM { background:linear-gradient(135deg,#ec4899,#a855f7); transform:rotate(8deg); }
    h1 { font-size:32px; margin-bottom:8px; background-image:linear-gradient(135deg,#fbbf24,#f97316,#ec4899,#a855f7); background-clip:text; -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    p { color:#c4b5fd; font-size:15px; max-width:440px; line-height:1.6; }
    a { display:inline-block; margin-top:24px; background:linear-gradient(135deg,#7c3aed,#a855f7); color:#fff; text-decoration:none; font-weight:700; padding:12px 28px; border-radius:999px; }
  </style>
</head>
<body>
  <div class="icon"><div class="tile tileL">L</div><div class="tile tileM">M</div></div>
  <h1>LetrasMix</h1>
  <p>Sopa de letras, anagramas, ahorcado y crucigramas — 4 juegos de palabras en una sola app, gratis en Google Play.</p>
  <a href="https://play.google.com/store/apps/details?id=com.letrasmix.app">Descargar en Google Play</a>
</body>
</html>
